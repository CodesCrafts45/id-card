{% extends "base.html" %}
{% block title %}{{ notice.title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="color-card p-4 p-md-5">
            <a href="{% url 'notice_list' %}" class="btn btn-sm btn-outline-secondary mb-3">
                <i class="bi bi-arrow-left me-1"></i>ফিরে যান
            </a>
            <h2 class="fw-bold mb-1">{{ notice.title }}</h2>
            <small class="text-muted">{{ notice.created_at|date:"d M, Y" }}</small>
            {% if notice.image %}
                <img src="{{ notice.image.url }}" class="img-fluid rounded-3 my-3 w-100" style="max-height:420px;object-fit:contain" alt="">
            {% endif %}
            <div class="mt-3" style="white-space:pre-line;line-height:1.7">{{ notice.content }}</div>
            {% if notice.pdf_file %}
            <div class="mt-4">
                <a href="{% url 'notice_pdf' notice.pk %}" class="btn btn-color">
                    <i class="bi bi-file-earmark-pdf me-1"></i>PDF ডাউনলোড
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
